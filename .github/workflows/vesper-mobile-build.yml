name: Build Vesper Mobile Debug APK

on:
  push:
    branches:
      - vesper
      - vesper-mobile-vnext
    paths:
      - ".github/workflows/vesper-mobile-build.yml"
      - "app/**"
      - "sendspin-shared/**"
      - "VESPER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply mobile variant
        shell: python
        run: |
          from pathlib import Path
          import base64

          build = Path("app/build.gradle.kts")
          text = build.read_text(encoding="utf-8")
          text = text.replace('base.archivesName.set("vesper-v${project.getVersionName()}")',
                              'base.archivesName.set("vesper-mobile-v${project.getVersionName()}")')
          build.write_text(text, encoding="utf-8")

          # Keep the checked-in Vesper vector for the shell validation build.

          strings = Path("app/src/main/res/values/strings.xml")
          text = strings.read_text(encoding="utf-8")
          text = text.replace(
              '<string name="app_name_release" translatable="false" tools:ignore="UnusedResources">Vesper</string>',
              '<string name="app_name_release" translatable="false" tools:ignore="UnusedResources">Vesper</string>'
          )
          text = text.replace(
              '<string name="app_name_debug" translatable="false" tools:ignore="UnusedResources">Vesper</string>',
              '<string name="app_name_debug" translatable="false" tools:ignore="UnusedResources">Vesper</string>'
          )
          strings.write_text(text, encoding="utf-8")

          prefs = Path("app/src/main/java/org/jellyfin/androidtv/preference/SystemPreferences.kt")
          text = prefs.read_text(encoding="utf-8")
          text = text.replace(
              'booleanPreference("disable_ui_mode_warning", false)',
              'booleanPreference("disable_ui_mode_warning", true)'
          )
          prefs.write_text(text, encoding="utf-8")

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace('android:icon="@mipmap/app_icon"', 'android:icon="@drawable/vesper_icon"')
          text = text.replace('android:networkSecurityConfig="@xml/network_security_config"', 'android:networkSecurityConfig="@xml/vesper_mobile_network_security_config"')
          text = text.replace(
              '                <action android:name="android.intent.action.MAIN" />\n',
              ''
          )
          text = text.replace(
              '                <category android:name="android.intent.category.LAUNCHER" />\n',
              ''
          )
          text = text.replace(
              '                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n',
              ''
          )
          text = text.replace(
              '        <activity\n'
              '            android:name=".ui.mobile.MobileStartupActivity"\n'
              '            android:exported="false"\n'
              '            android:windowSoftInputMode="adjustResize" />',
              '        <activity\n'
              '            android:name=".ui.mobile.MobileStartupActivity"\n'
              '            android:exported="true"\n'
              '            android:launchMode="singleTask"\n'
              '            android:windowSoftInputMode="adjustResize">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.MAIN" />\n'
              '                <category android:name="android.intent.category.LAUNCHER" />\n'
              '            </intent-filter>\n'
              '        </activity>'
          )
          text = text.replace(
              '        <activity\n'
              '            android:name=".ui.mobile.MobileMainActivity"\n'
              '            android:exported="false"\n'
              '            android:windowSoftInputMode="adjustResize" />',
              '        <activity\n'
              '            android:name=".ui.mobile.MobileMainActivity"\n'
              '            android:exported="false"\n'
              '            android:configChanges="density|screenSize|smallestScreenSize|screenLayout|orientation|keyboard|keyboardHidden|navigation|uiMode"\n'
              '            android:launchMode="singleTask"\n'
              '            android:windowSoftInputMode="adjustResize" />'
          )
          text = text.replace(
              '        <activity\n'
              '            android:name=".ui.mobile.MobilePlayerActivity"\n'
              '            android:exported="false"\n'
              '            android:windowSoftInputMode="adjustNothing" />',
              '        <activity\n'
              '            android:name=".ui.mobile.MobilePlayerActivity"\n'
              '            android:exported="false"\n'
              '            android:configChanges="density|screenSize|smallestScreenSize|screenLayout|orientation|keyboard|keyboardHidden|navigation|uiMode"\n'
              '            android:launchMode="singleTask"\n'
              '            android:windowSoftInputMode="adjustNothing" />'
          )
          manifest.write_text(text, encoding="utf-8")

          startup = Path("app/src/main/java/org/jellyfin/androidtv/ui/startup/StartupActivity.kt")
          text = startup.read_text(encoding="utf-8")
          text = text.replace(
              'import org.jellyfin.androidtv.ui.browsing.MainActivity',
              'import org.jellyfin.androidtv.ui.mobile.MobileMainActivity'
          )
          text = text.replace(
              'Intent(this, MainActivity::class.java)',
              'Intent(this, MobileMainActivity::class.java)'
          )
          startup.write_text(text, encoding="utf-8")

      - name: Restore stable Vesper debug signing key
        run: |
          base64 --decode .github/vesper-debug.keystore.b64 > .github/vesper-debug.keystore
          chmod 600 .github/vesper-debug.keystore
          keytool -list -v -keystore .github/vesper-debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"

      - name: Build mobile debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Vesper-mobile-debug.apk
          ls -lh dist/Vesper-mobile-debug.apk

      - name: Re-sign APK with stable Vesper key
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks .github/vesper-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out dist/Vesper-mobile-debug.signed.apk \
            dist/Vesper-mobile-debug.apk
          mv dist/Vesper-mobile-debug.signed.apk dist/Vesper-mobile-debug.apk
          "$APKSIGNER" verify --verbose --print-certs dist/Vesper-mobile-debug.apk

      - name: Verify stable signing key
        run: |
          EXPECTED_KEYSTORE_BLOB="d4aa1eb156060a37eb60466dddd95bf1f9e9a80c"
          ACTUAL_KEYSTORE_BLOB="$(git hash-object .github/vesper-debug.keystore.b64)"
          test "$ACTUAL_KEYSTORE_BLOB" = "$EXPECTED_KEYSTORE_BLOB" || {
            echo "::error::Vesper signing keystore changed. Refusing to publish an APK that could break update-install/data continuity."
            exit 1
          }

      - name: Verify package identity
        run: |
          EXPECTED_PACKAGE="app.vesper.androidtv.debug"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging dist/Vesper-mobile-debug.apk | grep -q "package: name='$EXPECTED_PACKAGE'" || {
            echo "::error::Unexpected package id. Refusing to publish a build that would create a separate app/data store."
            exit 1
          }

      - name: Verify APK signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          EXPECTED_CERT="$(
            keytool -list -v \
              -keystore .github/vesper-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
            | awk -F': ' '/SHA256:/ {print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]'
          )"

          ACTUAL_CERT="$(
            "$APKSIGNER" verify --print-certs dist/Vesper-mobile-debug.apk \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]'
          )"

          echo "Expected signer SHA-256: $EXPECTED_CERT"
          echo "Actual signer SHA-256:   $ACTUAL_CERT"

          test -n "$EXPECTED_CERT"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || {
            echo "::error::APK signer does not match the stable Vesper signing key. Refusing to publish."
            exit 1
          }

      - name: Verify Music Assistant transport policy
        run: |
          grep -Fq 'android:usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml || {
            echo "::error::Mobile build must allow local-LAN cleartext transport."
            exit 1
          }
          grep -Fq 'cleartextTrafficPermitted="true"' app/src/main/res/xml/vesper_mobile_network_security_config.xml || {
            echo "::error::Vesper mobile network policy no longer permits local-LAN HTTP."
            exit 1
          }
          grep -Fq 'require(isLocalCleartextHost(host))' app/src/main/java/org/jellyfin/androidtv/ui/mobile/VesperMusicEndpoint.kt || {
            echo "::error::Remote HTTP guard missing from Music Assistant endpoint validation."
            exit 1
          }

      - name: Verify settings continuity
        run: |
          SETTINGS_FILE="app/src/main/java/org/jellyfin/androidtv/ui/mobile/MobileSettingsActivity.kt"
          grep -Fq 'getSharedPreferences("vesper", MODE_PRIVATE)' "$SETTINGS_FILE" || {
            echo "::error::Vesper preferences store changed. Add an explicit migration before publishing."
            exit 1
          }
          for KEY in \
            music_assistant_url \
            music_assistant_token \
            seerr_api_key \
            tmdb_api_key \
            tvdb_api_key \
            tvdb_subscriber_pin
          do
            grep -Fq "\"$KEY\"" "$SETTINGS_FILE" || {
              echo "::error::Stored setting '$KEY' changed or disappeared. Add an explicit migration before publishing."
              exit 1
            }
          done

      - name: Upload Vesper Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Vesper-mobile-debug-apk
          path: dist/Vesper-mobile-debug.apk
          if-no-files-found: error
          retention-days: 30
