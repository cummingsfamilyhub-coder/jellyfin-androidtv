name: Build Vesper Debug APK

on:
  push:
    branches:
      - vesper
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Vesper-debug.apk
          ls -lh dist/Vesper-debug.apk

      - name: Upload Vesper APK
        uses: actions/upload-artifact@v4
        with:
          name: Vesper-debug-apk
          path: dist/Vesper-debug.apk
          if-no-files-found: error
          retention-days: 30
